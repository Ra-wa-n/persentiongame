<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Butterfly Multiverse 🦋</title>
    <style>
        :root {
            --bg-color: #08080c;
            --card-bg: #111118;
            --accent-color: #b5179e;
            --neon-purple: #7209b7;
            --neon-blue: #4cc9f0;
            --text-color: #f8f9fa;
            --ending-color: #f72585;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-image: radial-gradient(circle at center, #1a0933 0%, #08080c 80%);
        }

        .game-container {
            background-color: var(--card-bg);
            padding: 45px;
            border-radius: 24px;
            box-shadow: 0 0 50px rgba(114, 9, 183, 0.3), inset 0 0 20px rgba(114, 9, 183, 0.1);
            max-width: 800px;
            width: 100%;
            text-align: center;
            border: 2px solid var(--neon-purple);
            animation: borderGlow 4s infinite alternate;
        }

        @keyframes borderGlow {
            0% { border-color: var(--neon-purple); box-shadow: 0 0 30px rgba(114, 9, 183, 0.2); }
            100% { border-color: var(--accent-color); box-shadow: 0 0 50px rgba(181, 23, 158, 0.4); }
        }

        h1 {
            color: #fff;
            font-size: 2.6rem;
            margin-top: 0;
            margin-bottom: 5px;
            text-shadow: 0 0 15px var(--accent-color);
            font-weight: 900;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--neon-blue);
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(76, 201, 240, 0.5);
        }

        .story-text {
            font-size: 1.45rem; 
            line-height: 1.7;
            margin-bottom: 45px;
            min-height: 90px;
            font-weight: 500;
            color: #e2e2e9;
            padding: 0 20px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 18px;
            max-width: 600px;
            margin: 0 auto;
        }

        .btn {
            background: linear-gradient(90deg, rgba(114, 9, 183, 0.15) 0%, rgba(181, 23, 158, 0.05) 100%);
            color: var(--text-color);
            border: 2px solid var(--neon-purple);
            padding: 18px 25px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .btn:hover {
            border-color: var(--neon-blue);
            background: linear-gradient(90deg, var(--neon-purple) 0%, var(--accent-color) 100%);
            color: #fff;
            box-shadow: 0 0 25px rgba(114, 9, 183, 0.6);
            transform: translateY(-2px);
        }

        .btn-restart {
            background: linear-gradient(90deg, var(--ending-color) 0%, #f72585 100%);
            border-color: var(--ending-color);
            text-align: center;
            justify-content: center;
            margin-top: 25px;
            box-shadow: 0 0 20px rgba(247, 37, 133, 0.4);
        }
        
        .btn-restart:hover {
            background: #ff4797;
            border-color: #ff4797;
            box-shadow: 0 0 30px rgba(247, 37, 133, 0.8);
        }

        .ending-badge {
            display: inline-block;
            background-color: var(--ending-color);
            color: white;
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: 800;
            margin-bottom: 20px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 0 15px var(--ending-color);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>The Butterfly Multiverse 🦋</h1>
        <div class="subtitle">Pop Culture Interactive Live Simulation</div>
        
        <div id="game-content">
            <div class="story-text" id="story">Loading simulation...</div>
            <div class="choices-container" id="choices"></div>
        </div>
    </div>

    <script>
        const gameState = {
            // QUESTION 1
            start: {
                text: "Question 1: I'm running late for my interview. Do I take the dark alley shortcut, or order an Uber?",
                choices: [
                    { text: "🧭 Take the dark alley shortcut.", next: "alleyPath" },
                    { text: "🚗 Order an Uber.", next: "uberPath" }
                ]
            },
            
            // مسار بديل سريع وآمن
            alleyPath: {
                text: "⚠️ Route Blocked: The alley is closed for a movie shoot! You have to turn back.",
                choices: [
                    { text: "🔄 Turn back and order an Uber", next: "start" }
                ]
            },

            // LEVEL 2
            uberPath: {
                text: "Level 2: The Uber arrives, but the driver is completely silent, just like the movie 'Drive'. Do I tell him to drive like Fast & Furious, or play chill music?",
                choices: [
                    { text: "🏎️ Drive like Fast & Furious!", next: "fastFuriousPath" },
                    { text: "🎵 Play chill music.", next: "chillMusicPath" }
                ]
            },

            // مسار بديل سريع
            chillMusicPath: {
                text: "⚠️ Stuck in Traffic: The music is nice, but you are 45 minutes late! Let's rewind.",
                choices: [
                    { text: "🔄 Rewind and go Fast & Furious", next: "uberPath" }
                ]
            },

            // LEVEL 3
            fastFuriousPath: {
                text: "Level 3: We are flying over traffic, but the brakes are failing! Do I jump into a bush, or crash through the lobby window?",
                choices: [
                    { text: "🌳 Jump into a bush.", next: "bushPath" },
                    { text: "🪟 Crash through the lobby window!", next: "ending6" }
                ]
            },

            // مسار بديل سريع
            bushPath: {
                text: "⚠️ Mission Failed: You are safe in the bush, but you missed the interview entirely!",
                choices: [
                    { text: "🔄 Rewind and crash through the window", next: "fastFuriousPath" }
                ]
            },

            // ENDING 6 (النهاية الحقيقية واضحة ومبهرة على الشاشة)
            ending6: {
                text: "<span class='ending-badge'>🏆 Ending number 6</span><br>You crashed through the window, landed perfectly on the chair, and the CEO made you the VP of the company!",
                isEnding: true
            }
        };

        const storyElement = document.getElementById('story');
        const choicesContainer = document.getElementById('choices');

        function renderState(stateKey) {
            const state = gameState[stateKey];
            storyElement.innerHTML = state.text;
            choicesContainer.innerHTML = '';

            if (state.isEnding) {
                const restartBtn = document.createElement('button');
                restartBtn.className = 'btn btn-restart';
                restartBtn.innerText = '🔄 Timeline Reset';
                restartBtn.onclick = () => renderState('start');
                choicesContainer.appendChild(restartBtn);
            } else {
                state.choices.forEach(choice => {
                    const button = document.createElement('button');
                    button.className = 'btn';
                    button.innerText = choice.text;
                    button.onclick = () => renderState(choice.next);
                    choicesContainer.appendChild(button);
                });
            }
        }

        renderState('start');
    </script>
</body>
</html>
